<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=5, viewport-fit=cover" />
    <meta name="theme-color" content="#f2f2f2" />
    <meta name="color-scheme" content="light" />
    <meta
      name="description"
      content="PrintChakra turns any phone into a document scanner. Capture, clean up, read and print documents from one workspace."
    />
    <link rel="icon" href="%PUBLIC_URL%/logo.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://api.fontshare.com" />
    <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://api.fontshare.com/v2/css?f[]=clash-display@500,600,700&f[]=satoshi@400,500,700&display=swap"
    />
    <title>PrintChakra | Scan, read and print documents</title>
    <style>
      /* Critical CSS for preventing layout shift during load */
      html, body, #root {
        min-height: 100vh;
        min-height: 100dvh;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow-x: hidden;
        background: #f2f2f2;
      }
      #root {
        display: flex;
        flex-direction: column;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
